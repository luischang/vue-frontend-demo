[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# SPA: sin esta regla, recargar /config en Netlify devuelve 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# IMPORTANTE: las variables VITE_* NO se declaran aquí.
# Se configuran en el panel de Netlify (Site configuration > Environment variables).
# El secreto DEMO_API_KEY tampoco va aquí: no debe estar en el repositorio.
# Si una variable existiera en ambos lugares, netlify.toml gana sobre el panel.
